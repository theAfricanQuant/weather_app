name: Publish course pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v6

      - name: Assemble the course site
        run: |
          mkdir -p _site
          cp index.html MISSION.md NOTES.md RESOURCES.md GLOSSARY.md _site/
          cp -R assets lessons reference _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the course site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
